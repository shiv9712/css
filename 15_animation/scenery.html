<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task given by sir</title>

    <link rel="stylesheet" href="scenery.css">
</head>

<body>

<div class="sky">

    
    <div class="sun"></div>

    <div class="moon">

        <div class="crater c1"></div>
        <div class="crater c2"></div>
        <div class="crater c3"></div>

    </div>

    <!-- ANIMATED NIGHT OWL -->


    <!-- ================= STARS ================= -->

    <div class="stars">

        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
        <span>✧</span>
        <span>✦</span>
        <span>✧</span>

    </div>


  


    <!-- ================= HOUSE ================= -->

    <div class="house">

        <!-- Chimney -->
        <div class="chimney">

            <div class="smoke smoke1"></div>
            <div class="smoke smoke2"></div>
            <div class="smoke smoke3"></div>

        </div>


        <!-- Roof -->
        <div class="roof"></div>


        <!-- House body -->
        <div class="house-body">

            <!-- Left window -->
            <div class="window window-left">

                <div class="window-cross vertical"></div>
                <div class="window-cross horizontal"></div>

            </div>


            <!-- Door -->
            <div class="door">

                <div class="door-knob"></div>

            </div>


            <!-- Right window -->
            <div class="window window-right">

                <div class="window-cross vertical"></div>
                <div class="window-cross horizontal"></div>

            </div>

        </div>

    </div>


    <!-- ================= TREES ================= -->

    <div class="tree tree-left">

        <div class="tree-top"></div>
        <div class="tree-trunk"></div>

    </div>


    <div class="tree tree-right">

        <div class="tree-top"></div>
        <div class="tree-trunk"></div>

    </div>
    <!-- DAY BIRDS -->
<div class="day-birds">

    <div class="bird bird-day-1">
        <span></span><span></span>
    </div>

    <div class="bird bird-day-2">
        <span></span><span></span>
    </div>

    <div class="bird bird-day-3">
        <span></span><span></span>
    </div>

</div>


<!-- NIGHT BIRDS -->
<div class="night-birds">

    <div class="bird bird-night-1">
        <span></span><span></span>
    </div>

    <div class="bird bird-night-2">
        <span></span><span></span>
    </div>

</div>


    <!-- ================= GROUND ================= -->

    <div class="horizon"></div>

</div>

</body>
</html>
